# Builds, tests and publishes a signed release APK for every push to main.
# Needs four repository secrets: ALGOFEED_KEYSTORE_BASE64 (the .jks file, base64),
# ALGOFEED_STORE_PASSWORD, ALGOFEED_KEY_ALIAS and ALGOFEED_KEY_PASSWORD.
name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Run numbers only grow, so each release installs as an update of the previous one.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew :shared:desktopTest :androidApp:testDebugUnitTest :desktopApp:test

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ALGOFEED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALGOFEED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALGOFEED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALGOFEED_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          ./gradlew :androidApp:assembleRelease \
            -Palgofeed.versionCode="$VERSION_CODE" -Palgofeed.versionName="$VERSION_NAME" \
            -Palgofeed.release.storeFile="$keystore" -Palgofeed.release.storePassword="$STORE_PASSWORD" \
            -Palgofeed.release.keyAlias="$KEY_ALIAS" -Palgofeed.release.keyPassword="$KEY_PASSWORD"
          rm -f "$keystore"
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "algofeed-$VERSION_NAME.apk"

      # Without the mapping file, crash stack traces from this build can't be decoded.
      - uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ env.VERSION_NAME }}
          path: androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "algofeed-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" --title "Algofeed $VERSION_NAME" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
